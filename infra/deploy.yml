- name: Deploy static website
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: true

    - name: Copy website files
      copy:
        src: ../dist/prod/
        dest: /var/www/szabogergely
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Copy Nginx site config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/szabogergely
      notify: Reload Nginx

    - name: Enable site
      file:
        src: /etc/nginx/sites-available/szabogergely
        dest: /etc/nginx/sites-enabled/szabogergely
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
